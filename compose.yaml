services:
  homelab-world:
    build: .
    image: homelab-world:latest
    container_name: homelab-world
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      PIHOLE_URL: ${PIHOLE_URL:-}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
