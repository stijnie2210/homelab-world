services:
  homelab-world:
    build: .
    image: homelab-world:latest
    container_name: homelab-world
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      PIHOLE_URL: ${PIHOLE_URL:-}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:-}
    networks:
      - default
      - docker-api
    depends_on:
      - socket-proxy

  socket-proxy:
    image: wollomatic/socket-proxy:1.13.2
    container_name: homelab-world-socket-proxy
    restart: unless-stopped
    user: "65534:${DOCKER_GID:-0}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - -listenip=0.0.0.0
      - -allowfrom=homelab-world
      - -allowGET=^(/v1\.[0-9]+)?/(_ping|containers/json|containers/[a-zA-Z0-9_.-]+/stats|events)$$
      - -allowhealthcheck
      - -watchdoginterval=300
      - -stoponwatchdog
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

networks:
  docker-api:
    internal: true
